# .venv/bin/python agr_fgo/src/tightly_coupled_fgo.py --config agr_fgo/config/tc.yaml

data:
  # This path is relative to this YAML file, so the command works from any cwd.
  path: "../../great_data/campus"
  imu:  "../IMU/Tactical_imu_data.txt"
  nav: "BRDM00DLR_S_20203010000_01D_MN.rnx"
  obs: "campus-day.20O"
  # seconds; use null to process the entire dataset
  duration: 606.0  # increase after validating this growing-graph prototype

gnss_raw:
  signals:
    G:
      primary: "1C"
      secondary: "2W"  # GPS L1/L2 first-order ionosphere-free code
    E:
      primary: "1C"
      secondary: "7Q"  # Galileo E1/E5b first-order ionosphere-free code
    C:
      primary: "7I"
      secondary: "6I"  # BeiDou B2I/B3I first-order ionosphere-free code
  # GEO degraded both horizontal and 3D RMSE in the campus A/B test.
  beidou_orbits: ["MEO", "IGSO"]
  minimum_elevation_deg: 10.0
  pseudorange_sigma_m:
    G: 8.9
    E: 8.9
    C_MEO: 12.0
    C_IGSO: 15.0
    C_GEO: 25.0
  weighting:
    elevation_sin_floor: 0.25
    cn0_reference_dbhz: 40.0
    cn0_max_scale: 4.0
    minimum_cn0_dbhz: 20.0
    residual_gate_m: 30.0
  doppler_sigma_mps: 0.3
  # null: estimate the first receiver ECEF position with pseudorange SPP.
  # If a surveyed value is available, use [x, y, z] metres for faster startup.
  initial_position_ecef: null

tightly_coupled:
  gravity_mps2: 9.81
  optimizer: "isam2"
  relinearize_threshold: 0.1
  relinearize_skip: 10
  final_update_iterations: 20
  # Estimator body is FLU (x forward, y left, z up). The campus tactical IMU
  # is RFU (x right, y forward, z up), so RFU [-0.05, -0.33, 0.16] becomes:
  lever_arm_body_m: [-0.33, 0.05, 0.16]
  imu_extrinsic:
    # Pose of the RFU IMU sensor frame expressed in the FLU body frame.
    # R_body_sensor maps [right, forward, up] -> [forward, left, up].
    translation_m: [0.0, 0.0, 0.0]
    quaternion_xyzw: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
  initial_alignment:
    stationary_duration_s: 10.0
    course_search_duration_s: 90.0
    minimum_course_speed_mps: 2.0
    course_tolerance_deg: 12.0
    required_course_samples: 3
    fallback_yaw_deg: 0.0
  imu:
    skip_rows: 1
    timestamp_column: 0
    gyro_columns: [1, 2, 3]
    angular_velocity_scale: 0.017453292519943295  # deg/s -> rad/s
    accel_columns: [4, 5, 6]
  imu_noise:
    accelerometer_sigma: 0.03
    gyroscope_sigma: 0.003
    integration_sigma: 1.0e-4
    accelerometer_bias_sigma: 1.0e-3
    gyroscope_bias_sigma: 1.0e-4
  prior_noise:
    rotation_sigma_rad: [0.1, 0.1, 0.5]
    position_sigma_m: [3.0, 3.0, 5.0]
    velocity_sigma_mps: 1.0
    accel_bias_sigma_mps2: [0.1, 0.1, 0.1]
    gyro_bias_sigma_radps: [0.01, 0.01, 0.01]
    clock_bias_sigma_m: 100.0
    clock_drift_sigma_mps: 10.0
  clock_process:
    bias_sigma_m_sqrt_s: 3.0
    drift_sigma_mps_sqrt_s: 0.3
  galileo_isb:
    initial_sigma_m: 100.0
    random_walk_sigma_m_sqrt_s: 0.3
  beidou_isb:
    initial_sigma_m: 100.0
    random_walk_sigma_m_sqrt_s: 0.3
  wet_delay:
    # Available for experiments, but disabled by default: the campus A/B run
    # slightly worsened Up/3D RMSE because this 10-minute code-only dataset
    # does not separate ZWD well from height and receiver clock.
    enabled: false
    initial_sigma_m: 0.30
    random_walk_sigma_m_sqrt_s: 0.005
  numerical_stabilization:
    rotation_sigma_rad: 3.0
    position_sigma_m: 10000.0
    velocity_sigma_mps: 100.0
    accel_bias_sigma_mps2: 10.0
    gyro_bias_sigma_radps: 1.0
    clock_drift_sigma_mps: 100.0
  output_csv: "../results/great_data/tc_trajectory.csv"
